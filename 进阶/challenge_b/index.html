<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>系统失效诊断 · 离线样机</title>
<style>body{max-width:960px;margin:32px auto;font:16px system-ui;padding:0 16px;color:#17202a}button,select{padding:8px;margin:6px}#summary,#evidence{background:#f2f5f8;padding:16px;margin-top:16px;border-radius:6px}dl{display:grid;grid-template-columns:180px 1fr;gap:8px;margin:0}dt{font-weight:700}dd{margin:0}article{border-top:1px solid #c7d0d9;padding:12px 0}small{color:#555}</style>
<h1>系统失效诊断</h1><p>合成材料与固定响应离线重放；没有模型API调用。</p>
<select id="cases"></select><label><input type="checkbox" id="reset">运行前清空状态</label><button id="run">运行所选案例</button>
<p><small>观察请求顺序如何影响输出。R01→R02请保持状态；其他独立案例可勾选清空。候选人需完善差异、来源与验证状态展示。</small></p>
<section id="summary">等待执行</section><section id="evidence"></section>
<script>
const el=document.getElementById('cases'),summary=document.getElementById('summary'),evidence=document.getElementById('evidence');
const field=(name,value)=>{const dt=document.createElement('dt');dt.textContent=name;const dd=document.createElement('dd');dd.textContent=value==null?'null':String(value);return [dt,dd]};
fetch('/api/cases').then(r=>r.json()).then(d=>d.cases.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' · '+c.request.doc_ids.join(',')+' / '+c.request.snapshot+' · '+c.request.query;el.append(o)})).catch(e=>summary.textContent=String(e));
document.getElementById('run').onclick=async()=>{try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:el.value,reset:document.getElementById('reset').checked})});const value=await r.json();summary.replaceChildren();const dl=document.createElement('dl');[['request_id',value.request_id],['status',value.status],['request',JSON.stringify(value.request)],['actual_scope',JSON.stringify(value.actual_scope)],['locator_status',value.locator_status],['support_status',value.support_status],['judgment_source',value.judgment_source],['cache_hit',value.cache_hit],['run_kind',value.run_kind],['elapsed_ms',value.elapsed_ms]].forEach(([k,v])=>field(k,v).forEach(n=>dl.append(n)));summary.append(dl);evidence.replaceChildren();const title=document.createElement('h2');title.textContent='实际证据';evidence.append(title);(value.evidence||[]).forEach(block=>{const article=document.createElement('article');const heading=document.createElement('strong');heading.textContent=block.id+' · '+block.doc_id+' / '+block.snapshot+' · page '+block.page;const text=document.createElement('p');text.textContent=block.text;article.append(heading,text);evidence.append(article)});if(!value.evidence||!value.evidence.length){const empty=document.createElement('p');empty.textContent='本次请求没有可展示的证据';evidence.append(empty)}}catch(e){summary.textContent=String(e)}};
</script></html>
